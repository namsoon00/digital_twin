name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation scope
        type: choice
        default: quick
        options:
          - quick
          - full

permissions:
  contents: read

jobs:
  smoke:
    name: Development validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'full' && 30 || 10 }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: orbit_alpha
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      OPERATIONAL_DB_BACKEND: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: orbit_alpha
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      # This disposable CI container is explicitly test-owned. Local/self-hosted
      # runs use the separate test runtime rather than the app's MySQL server.
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        run: python3 -m pip install --user pymysql typedb-driver==3.12.0 websockets==15.0.1

      - name: Run quick checks
        if: ${{ inputs.suite != 'full' }}
        run: npm test

      - name: Run full release checks
        if: ${{ inputs.suite == 'full' }}
        run: npm run test:full
